spring:
  cache:
    type: simple
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 500
        request.timeout.ms: 500
  datasource:
    url: jdbc:h2:mem:eopis_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.eopis: DEBUG
