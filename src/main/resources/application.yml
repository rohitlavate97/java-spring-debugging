server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: eopis-app
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eopis_db}
    username: ${DB_USER:eopis_user}
    password: ${DB_PASSWORD:eopis_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EopisHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,chaos
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlation_id:-},%X{request_id:-}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{correlation_id:-},%X{request_id:-}] [%t] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    com.eopis: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.springframework.orm.jpa: INFO
    org.springframework.transaction: INFO

eopis:
  chaos:
    enabled: false
    faults: {}
