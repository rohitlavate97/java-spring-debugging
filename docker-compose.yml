version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eopis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eopis_db
      POSTGRES_USER: eopis_user
      POSTGRES_PASSWORD: eopis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eopis_user -d eopis_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eopis-network

  redis:
    image: redis:7-alpine
    container_name: eopis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eopis-network

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: eopis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eopis.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eopis-network

  eopis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eopis-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eopis_db
      DB_USER: eopis_user
      DB_PASSWORD: eopis_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eopis-network

volumes:
  postgres_data:

networks:
  eopis-network:
    driver: bridge
